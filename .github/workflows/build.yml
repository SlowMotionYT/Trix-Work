name: build
run-name: build ${{ inputs.target }} ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: string
      target:
        required: true
        type: string
      chunks:
        required: true
        type: string
      name:
        required: true
        type: string
      site:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.target == 'exe' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: inputs.target != 'exe'
        with:
          distribution: temurin
          java-version: ${{ inputs.target == 'jar' && '21' || '17' }}

      - uses: android-actions/setup-android@v3
        if: contains(inputs.target, 'apk') || inputs.target == 'aab'

      - name: Compilar
        env:
          PYTHONUTF8: "1"
          TRIX_SITE: ${{ inputs.site }}
          TRIX_SECRET: ${{ secrets.BUILD_SECRET }}
          TRIX_JOB: ${{ inputs.job }}
          TRIX_TARGET: ${{ inputs.target }}
          TRIX_CHUNKS: ${{ inputs.chunks }}
          TRIX_NAME: ${{ inputs.name }}
        run: python .github/trix/trix.py
