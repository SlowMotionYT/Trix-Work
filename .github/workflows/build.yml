name: build
run-name: build ${{ inputs.target }} ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        required: true
        type: string
      target:
        required: true
        type: string
      chunks:
        required: true
        type: string
      name:
        required: true
        type: string
      site:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.target == 'exe' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: inputs.target != 'exe'
        with:
          distribution: temurin
          java-version: ${{ inputs.target == 'jar' && '21' || '17' }}

      - name: Android SDK
        if: contains(inputs.target, 'apk') || inputs.target == 'aab'
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar
        id: compilar
        env:
          PYTHONUTF8: "1"
          TRIX_SITE: ${{ inputs.site }}
          TRIX_SECRET: ${{ secrets.BUILD_SECRET }}
          TRIX_JOB: ${{ inputs.job }}
          TRIX_TARGET: ${{ inputs.target }}
          TRIX_CHUNKS: ${{ inputs.chunks }}
          TRIX_NAME: ${{ inputs.name }}
        run: python .github/trix/trix.py

      - name: Avisar fallo
        if: failure() && steps.compilar.outcome == 'skipped'
        shell: bash
        env:
          TRIX_SITE: ${{ inputs.site }}
          TRIX_SECRET: ${{ secrets.BUILD_SECRET }}
          TRIX_JOB: ${{ inputs.job }}
        run: |
          curl -sS -X POST "$TRIX_SITE/.netlify/functions/report" \
            -H "content-type: application/json" \
            -H "x-trix-secret: $TRIX_SECRET" \
            -d "{\"job\":\"$TRIX_JOB\",\"status\":\"failed\",\"stage\":\"Error\",\"errors\":\"Fallo la preparacion del entorno en GitHub Actions. Abre la pestana Actions del repositorio y copia el error del paso en rojo.\",\"purgeSrc\":true}"
